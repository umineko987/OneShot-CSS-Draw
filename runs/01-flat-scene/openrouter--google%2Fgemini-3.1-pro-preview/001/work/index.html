<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OneShot - Niko in Wheat Field</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #222;
    }
    .canvas-container {
      width: 1440px;
      height: 805px;
      overflow: hidden;
      background-color: #ffffff;
      position: relative;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <svg viewBox="0 0 1440 805" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#ffffff" />
          <stop offset="85%" stop-color="#fff4eb" />
          <stop offset="100%" stop-color="#ffe4cc" />
        </linearGradient>

        <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd5a6" stop-opacity="0"/>
          <stop offset="25%" stop-color="#ffc68a" stop-opacity="0.8"/>
          <stop offset="60%" stop-color="#f59c40" stop-opacity="1"/>
          <stop offset="100%" stop-color="#b8450d" stop-opacity="1"/>
        </linearGradient>

        <!-- Filters -->
        <filter id="blurL" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="60" />
        </filter>
        <filter id="blurM" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="25" />
        </filter>
        <filter id="blurS" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" />
        </filter>

        <!-- Templates -->
        <g id="w">
          <path d="M 0,0 L 0,-65" stroke="#e09e53" stroke-width="3.5" fill="none"/>
          <path d="M0,0 L-7,-12 L0,-20 L-9,-32 L0,-40 L-8,-52 L0,-65 L-2,-75 L5,-62 L12,-48 L4,-40 L14,-22 L6,-12 L14,0 Z" fill="#ffebc2" stroke="#d48c48" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M-7,-12 L-25,-25 M-9,-32 L-30,-45 M-8,-52 L-28,-65 L-5,-75 L-15,-95 M5,-62 L18,-80 M12,-48 L30,-65 M14,-22 L32,-35 M14,0 L25,-12" stroke="#d48c48" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </defs>

      <!-- 1. Sky Base -->
      <rect width="1440" height="805" fill="url(#skyGradient)" />
      <!-- Replaced with correct ID -->
      <rect width="1440" height="805" fill="url(#skyGrad)" />

      <!-- Wind lines (subtle in sky) -->
      <g stroke="#fcd99a" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round">
        <path d="M 200,100 Q 250,90 300,105" />
        <path d="M 400,200 Q 450,190 500,205" />
        <path d="M 850,150 Q 920,135 980,155" />
        <path d="M 1150,100 Q 1200,90 1250,105" />
      </g>

      <!-- 2. Distant Hills / Haze -->
      <g filter="url(#blurM)">
        <ellipse cx="300" cy="520" rx="550" ry="120" fill="#ffe2c4" />
        <ellipse cx="1000" cy="520" rx="650" ry="130" fill="#ffe2c4" />
      </g>

      <!-- 3. Village Background -->
      <!-- Village Glow / Haze -->
      <ellipse cx="1150" cy="550" rx="400" ry="150" fill="#ffffff" opacity="0.5" filter="url(#blurL)" />
      
      <g id="village" stroke="#91746c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <!-- House 1 -->
        <path d="M 870,620 L 890,560 L 950,560 L 960,620 Z" fill="#d0b3a3" />
        <path d="M 865,565 L 920,520 L 965,565 Z" fill="#997b76" />
        <path d="M 895,540 L 895,510 L 910,510 L 910,528" fill="#d0b3a3" />

        <!-- House 2 -->
        <path d="M 1030,620 L 1050,550 L 1110,550 L 1120,620 Z" fill="#c3a093" />
        <path d="M 1025,555 L 1080,510 L 1125,555 Z" fill="#91736f" />
        <path d="M 1100,535 L 1100,500 L 1110,500 L 1110,525" fill="#c3a093" />

        <!-- Clock Tower Building -->
        <path d="M 1160,620 L 1180,490 L 1260,490 L 1270,620 Z" fill="#cfab99" />
        <path d="M 1165,495 L 1220,410 L 1275,495 Z" fill="#8e7169" />
        <!-- Clock -->
        <circle cx="1220" cy="475" r="18" fill="#fdf2d5" stroke="#91746c" stroke-width="2" />
        <path d="M 1220,475 L 1220,463 M 1220,475 L 1210,475" />
        
        <!-- Side Wing -->
        <path d="M 1250,620 L 1260,540 L 1350,540 L 1360,620 Z" fill="#ba9688" />
        <path d="M 1255,545 L 1305,490 L 1365,545 Z" fill="#91736f" />

        <!-- House 3 -->
        <path d="M 1360,620 L 1370,550 L 1440,550 L 1440,620 Z" fill="#cdab9a" />
        <path d="M 1355,555 L 1405,510 L 1450,555 Z" fill="#8e7169" />
      </g>

      <!-- 4. Background Wheat Stalks (Thin, distant) -->
      <g stroke="#ebaf6c" fill="none" opacity="0.5">
        <path d="M 500,850 Q 520,600 500,480" stroke-width="3" />
        <path d="M 550,850 Q 560,650 540,500" stroke-width="2" />
        <path d="M 600,850 Q 600,600 580,460" stroke-width="3" />
        <path d="M 800,850 Q 780,650 760,520" stroke-width="3" />
        <path d="M 850,850 Q 820,600 800,480" stroke-width="2" />
        <path d="M 950,850 Q 920,650 880,500" stroke-width="3" />
        <path d="M 1000,850 Q 960,600 940,460" stroke-width="2" />
        <path d="M 1100,850 Q 1050,650 1020,520" stroke-width="3" />
        <path d="M 1150,850 Q 1100,600 1060,480" stroke-width="2" />
        <path d="M 1300,850 Q 1250,650 1200,500" stroke-width="3" />
      </g>
      <!-- Background heads -->
      <g opacity="0.4">
        <use href="#w" x="500" y="480" transform="rotate(-25, 500, 480) scale(0.6)" />
        <use href="#w" x="540" y="500" transform="rotate(-30, 540, 500) scale(0.5)" />
        <use href="#w" x="580" y="460" transform="rotate(-20, 580, 460) scale(0.6)" />
        <use href="#w" x="760" y="520" transform="rotate(-25, 760, 520) scale(0.6)" />
        <use href="#w" x="800" y="480" transform="rotate(-35, 800, 480) scale(0.7)" />
        <use href="#w" x="880" y="500" transform="rotate(-30, 880, 500) scale(0.6)" />
        <use href="#w" x="940" y="460" transform="rotate(-40, 940, 460) scale(0.7)" />
        <use href="#w" x="1020" y="520" transform="rotate(-35, 1020, 520) scale(0.6)" />
        <use href="#w" x="1060" y="480" transform="rotate(-45, 1060, 480) scale(0.7)" />
        <use href="#w" x="1200" y="500" transform="rotate(-40, 1200, 500) scale(0.7)" />
      </g>

      <!-- 5. Midground Field Base (Watercolor Blobs) -->
      <rect x="0" y="450" width="1440" height="355" fill="url(#groundGrad)" />
      <g filter="url(#blurL)">
        <ellipse cx="200" cy="700" rx="450" ry="200" fill="#f79836" />
        <ellipse cx="720" cy="750" rx="650" ry="250" fill="#e86b1c" />
        <ellipse cx="1200" cy="650" rx="550" ry="150" fill="#f5af53" />
        <ellipse cx="500" cy="550" rx="350" ry="120" fill="#ffc77d" />
        <ellipse cx="900" cy="550" rx="400" ry="120" fill="#ffc77d" />
        <ellipse cx="1400" cy="750" rx="450" ry="200" fill="#c7490a" />
        <ellipse cx="0" cy="800" rx="350" ry="150" fill="#a83500" />
      </g>

      <!-- 6. Niko -->
      <g id="niko" transform="translate(660, 430)">
         <!-- Coat Background / Folds -->
         <path d="M -20,20 L 20,20 C 60,80 80,250 50,380 L -120,380 C -100,250 -60,80 -20,20 Z" fill="#584347" stroke="#36262a" stroke-width="4" stroke-linejoin="round"/>
         <path d="M -5,30 C 15,100 35,250 25,380 L 50,380 C 80,250 60,80 20,20 Z" fill="#433235" />
         <path d="M -60,100 C -60,180 -90,280 -120,380 L -80,380 C -50,280 -40,180 -40,100 Z" fill="#433235" />
         
         <!-- Scarf Back Tail (Tail 2) -->
         <path d="M -10,30 C -120,10 -250,20 -350,15 C -360,15 -370,25 -350,35 C -300,50 -200,60 -150,60 C -100,60 -50,70 -10,60 Z" fill="#7567a5" stroke="#413359" stroke-width="3" stroke-linejoin="round"/>
         
         <!-- Scarf Front Tail (Tail 1) -->
         <path d="M -30,0 C -10,25 40,25 70,0 C 70,30 20,60 -30,30 Z" fill="#998ccf" stroke="#413359" stroke-width="3" stroke-linejoin="round"/>
         <path d="M -30,20 C -120,-10 -220,-110 -300,-180 C -320,-200 -340,-190 -330,-170 C -290,-110 -220,0 -120,60 Z" fill="#998ccf" stroke="#413359" stroke-width="3" stroke-linejoin="round"/>
         
         <!-- Detached fringes (Tail 1) -->
         <polygon points="-360,-220 -350,-225 -345,-215 -355,-210" fill="#998ccf" stroke="#413359" stroke-width="2"/>
         <polygon points="-375,-205 -365,-205 -365,-195 -375,-195" fill="#998ccf" stroke="#413359" stroke-width="2"/>
         <polygon points="-380,-180 -370,-175 -375,-165 -385,-170" fill="#998ccf" stroke="#413359" stroke-width="2"/>
         <polygon points="-370,-150 -360,-155 -355,-145 -365,-140" fill="#998ccf" stroke="#413359" stroke-width="2"/>
         <polygon points="-345,-135 -335,-145 -330,-140 -340,-130" fill="#998ccf" stroke="#413359" stroke-width="2"/>
         
         <!-- Detached fringes (Tail 2) -->
         <polygon points="-390,-15 -380,-20 -375,-10 -385,-5" fill="#7567a5" stroke="#413359" stroke-width="2"/>
         <polygon points="-400,5 -390,5 -390,15 -400,15" fill="#7567a5" stroke="#413359" stroke-width="2"/>
         <polygon points="-395,30 -385,25 -380,35 -390,40" fill="#7567a5" stroke="#413359" stroke-width="2"/>

         <!-- Hat Brim -->
         <path d="M -70,0 C -40,-45 40,-25 90,-5 C 120,5 100,25 60,15 C 10,5 -60,15 -70,0 Z" fill="#674f52" stroke="#36262a" stroke-width="3" stroke-linejoin="round"/>
         <path d="M -40,-10 C -10,-35 40,-20 70,-5 L 60,0 C 30,-15 -20,-30 -45,-15 Z" fill="#8c6f70" />

         <!-- Hat Top -->
         <path d="M -20,-15 C -30,-65 30,-65 55,-10 C 30,-30 0,-30 -20,-15 Z" fill="#806561" stroke="#36262a" stroke-width="3" stroke-linejoin="round"/>
         
         <!-- Ears -->
         <path d="M -25,-25 L -30,-75 L 5,-40 Z" fill="#806561" stroke="#36262a" stroke-width="3" stroke-linejoin="round"/>
         <path d="M -22,-35 L -24,-60 L -5,-45 Z" fill="#b0938b" />
         <path d="M 30,-35 L 45,-85 L 65,-25 Z" fill="#806561" stroke="#36262a" stroke-width="3" stroke-linejoin="round"/>
         <path d="M 35,-35 L 45,-70 L 55,-32 Z" fill="#b0938b" />
      </g>

      <!-- 7. Detailed Foreground Wheat Stalks -->
      <g>
        <!-- Wheat Stalk 1 -->
        <path d="M -50,850 Q 80,600 150,380" stroke="#eda957" stroke-width="9" fill="none" stroke-linecap="round"/>
        <use href="#w" x="150" y="380" transform="rotate(-40, 150, 380) scale(1.6)" />

        <!-- Wheat Stalk 2 -->
        <path d="M 80,850 Q 180,650 250,450" stroke="#e69c4a" stroke-width="7" fill="none" stroke-linecap="round"/>
        <use href="#w" x="250" y="450" transform="rotate(-30, 250, 450) scale(1.4)" />

        <!-- Wheat Stalk 3 -->
        <path d="M 250,850 Q 320,680 380,520" stroke="#f2bc79" stroke-width="6" fill="none" stroke-linecap="round"/>
        <use href="#w" x="380" y="520" transform="rotate(-35, 380, 520) scale(1.2)" />

        <!-- Wheat Stalk 4 -->
        <path d="M 450,850 Q 480,650 440,430" stroke="#e69c4a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <use href="#w" x="440" y="430" transform="rotate(-45, 440, 430) scale(1.1)" />

        <!-- Wheat Stalk 5 -->
        <path d="M 150,850 Q 200,700 220,550" stroke="#f2bc79" stroke-width="4" fill="none" stroke-linecap="round"/>
        <use href="#w" x="220" y="550" transform="rotate(-25, 220, 550) scale(0.9)" />

        <!-- Wheat Stalk 6 -->
        <path d="M 350,850 Q 380,600 350,380" stroke="#e08e3d" stroke-width="4" fill="none" stroke-linecap="round"/>
        <use href="#w" x="350" y="380" transform="rotate(-50, 350, 380) scale(0.95)" />

        <!-- Wheat Stalk 7 -->
        <path d="M 750,850 Q 720,650 680,480" stroke="#e69c4a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <use href="#w" x="680" y="480" transform="rotate(-20, 680, 480) scale(1.1)" />

        <!-- Wheat Stalk 8 -->
        <path d="M 900,850 Q 860,650 820,440" stroke="#f2bc79" stroke-width="5" fill="none" stroke-linecap="round"/>
        <use href="#w" x="820" y="440" transform="rotate(-30, 820, 440) scale(1.1)" />

        <!-- Wheat Stalk 9 -->
        <path d="M 1050,850 Q 980,600 920,380" stroke="#eda957" stroke-width="7" fill="none" stroke-linecap="round"/>
        <use href="#w" x="920" y="380" transform="rotate(-35, 920, 380) scale(1.3)" />

        <!-- Wheat Stalk 10 -->
        <path d="M 1200,850 Q 1120,650 1080,450" stroke="#e69c4a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <use href="#w" x="1080" y="450" transform="rotate(-40, 1080, 450) scale(1.2)" />

        <!-- Wheat Stalk 11 -->
        <path d="M 1350,850 Q 1280,620 1250,420" stroke="#eda957" stroke-width="8" fill="none" stroke-linecap="round"/>
        <use href="#w" x="1250" y="420" transform="rotate(-40, 1250, 420) scale(1.4)" />

        <!-- Wheat Stalk 12 -->
        <path d="M 1450,850 Q 1420,600 1380,350" stroke="#f2bc79" stroke-width="9" fill="none" stroke-linecap="round"/>
        <use href="#w" x="1380" y="350" transform="rotate(-45, 1380, 350) scale(1.6)" />
      </g>

      <!-- 8. Out of Focus Foreground Stalks -->
      <g filter="url(#blurS)" opacity="0.9">
         <path d="M -20,850 Q 40,650 70,500" stroke="#e86b1c" stroke-width="14" fill="none" stroke-linecap="round"/>
         <path d="M 1400,850 Q 1380,600 1330,420" stroke="#d15513" stroke-width="12" fill="none" stroke-linecap="round"/>
         <path d="M 600,850 Q 590,750 560,650" stroke="#e86b1c" stroke-width="10" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 9. Floating Petals / Leaves -->
      <g>
        <path d="M 120,150 Q 135,142 150,150 Q 135,158 120,150 Z" fill="#f4b562" transform="rotate(-30, 120, 150) scale(1.2)" />
        <path d="M 80,200 Q 100,192 120,200 Q 100,208 80,200 Z" fill="#fcd99a" transform="rotate(-15, 80, 200) scale(1.4)" />
        <path d="M 350,120 Q 370,112 390,120 Q 370,128 350,120 Z" fill="#e08e3d" transform="rotate(-40, 350, 120) scale(1)" />
        <path d="M 520,180 Q 540,172 560,180 Q 540,188 520,180 Z" fill="#fce4b3" transform="rotate(-25, 520, 180) scale(1.5)" />
        <path d="M 680,280 Q 695,272 710,280 Q 695,288 680,280 Z" fill="#f4b562" transform="rotate(-20, 680, 280) scale(1.2)" />
        <path d="M 750,150 Q 770,142 790,150 Q 770,158 750,150 Z" fill="#fcd99a" transform="rotate(-35, 750, 150) scale(1.3)" />
        <path d="M 900,220 Q 915,212 930,220 Q 915,228 900,220 Z" fill="#f4b562" transform="rotate(-10, 900, 220) scale(1)" />
        <path d="M 1050,150 Q 1070,142 1090,150 Q 1070,158 1050,150 Z" fill="#e08e3d" transform="rotate(-30, 1050, 150) scale(1.4)" />
        <path d="M 1250,300 Q 1270,292 1290,300 Q 1270,308 1250,300 Z" fill="#fce4b3" transform="rotate(-45, 1250, 300) scale(1.6)" />
        <path d="M 1350,180 Q 1365,172 1380,180 Q 1365,188 1350,180 Z" fill="#f4b562" transform="rotate(-25, 1350, 180) scale(1.1)" />
        <path d="M 450,250 Q 465,242 480,250 Q 465,258 450,250 Z" fill="#f4b562" transform="rotate(-15, 450, 250) scale(1)" />
        <path d="M 1150,250 Q 1165,242 1180,250 Q 1165,258 1150,250 Z" fill="#fcd99a" transform="rotate(-20, 1150, 250) scale(1.2)" />
      </g>
    </svg>
  </div>
</body>
</html>
