<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wheat Field Scene</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 805px;
    display: block;
  }
</style>
</head>
<body>
<svg id="canvas" width="1440" height="805" viewBox="0 0 1440 805" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft watercolor blur filter -->
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="haloBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfaf3"/>
      <stop offset="55%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#f6efdf"/>
    </linearGradient>

    <!-- Field gradient (fades from transparent at top into gold) -->
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e2b4" stop-opacity="0"/>
      <stop offset="12%" stop-color="#f3e2b4" stop-opacity="0.55"/>
      <stop offset="32%" stop-color="#ecca8c" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e4b066" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#cf9450" stop-opacity="1"/>
    </linearGradient>

    <!-- Backlit pale wheat stalk symbol; call with currentColor -->
    <g id="grain">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M0,-82 C3,-100 6,-114 10,-127"/>
        <path d="M0,-82 C-3,-100 -6,-114 -10,-127"/>
        <path d="M0,-82 C0,-102 -1,-118 -1,-130"/>
        <path d="M0,-64 C7,-82 14,-98 20,-112"/>
        <path d="M0,-64 C-7,-82 -14,-98 -20,-112"/>
        <path d="M0,-46 C9,-61 16,-75 23,-88"/>
        <path d="M0,-46 C-9,-61 -16,-75 -23,-88"/>
      </g>
      <g fill="currentColor" stroke="rgba(96,56,16,0.13)" stroke-width="0.7">
        <ellipse cx="0"   cy="-10" rx="7.6" ry="17"/>
        <ellipse cx="2"   cy="-27" rx="7.2" ry="16"/>
        <ellipse cx="-2"  cy="-43" rx="6.8" ry="15"/>
        <ellipse cx="1.5" cy="-58" rx="6.2" ry="14"/>
        <ellipse cx="-1"  cy="-71" rx="5.4" ry="12"/>
        <ellipse cx="0.5" cy="-82" rx="4.4" ry="9"/>
        <ellipse cx="0"   cy="-90" rx="3.1" ry="6"/>
      </g>
    </g>

    <!-- Single wheat leaf/head for floating pieces -->
    <g id="leaf">
      <path d="M0,0 C10,-8 20,-10 32,-7 C20,-3 10,-1 0,0 Z" fill="currentColor" opacity="0.9"/>
    </g>

    <!-- House + gable roof group (call with currentColor for walls) -->
    <g id="house">
      <path d="M-22,0 L-22,-30 L0,-46 L22,-30 L22,0 Z" fill="currentColor"/>
      <path d="M-24,-31 L0,-49 L24,-31 L24,-27 L0,-45 L-24,-27 Z" fill="#6e4d39"/>
      <rect x="-15" y="-18" width="9" height="9" rx="1" fill="#5c4334"/>
    </g>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="0" y="0" width="1440" height="805" fill="url(#sky)"/>
  <!-- faint warm tint near horizon -->
  <ellipse cx="720" cy="430" rx="760" ry="120" fill="#f2dfb2" opacity="0.5" filter="url(#softBig)"/>

  <!-- ================= FIELD BASE ================= -->
  <rect x="0" y="365" width="1440" height="440" fill="url(#field)"/>

  <g filter="url(#soft)" opacity="0.55">

    <ellipse cx="420" cy="720" rx="240" ry="110" fill="#dfa057"/>

    <g color="#c9a77e" transform="translate(970,478) scale(0.85)">
      <use href="#house"/>
    </g>
    <!-- house block left of tower -->
    <g color="#c29b76" transform="translate(1128,522) scale(1.5)">
      <use href="#house"/>
    </g>
    <g color="#c7a07b" transform="translate(1060,508) scale(1.05)">

      <line x1="0" y1="-26" x2="0" y2="-36" stroke="#3f352c" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="0" y1="-26" x2="6" y2="-22" stroke="#3f352c" stroke-width="2.2" stroke-linecap="round"/>

    </g>
    <g color="#be9671" transform="translate(1372,545) scale(0.7)">

    <path d="M690,470 C694,525 706,590 714,660 L700,660 C694,595 684,525 682,470 Z" fill="#5a4437" opacity="0.55"/>
