<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Flat Scene</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  .canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 805px;
    overflow: hidden;
    background: #cfe9f7;
  }
  .canvas > svg {
    display: block;
    width: 1440px;
    height: 805px;
  }
</style>
</head>
<body>
<div class="canvas">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 805" width="1440" height="805" role="img" aria-label="Flat landscape illustration">
  <defs>
    <linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="530">
      <stop offset="0" stop-color="#2E7CC0"/>
      <stop offset="0.38" stop-color="#63A9DA"/>
      <stop offset="0.72" stop-color="#A9D6EC"/>
      <stop offset="1" stop-color="#E3F3FA"/>
    </linearGradient>

    <radialGradient id="sunGlow" gradientUnits="userSpaceOnUse" cx="1060" cy="288" r="370">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFEFB4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFEFB4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hazeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="462" x2="0" y2="524">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="lakeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="516" x2="0" y2="656">
      <stop offset="0" stop-color="#ABDEF2"/>
      <stop offset="0.5" stop-color="#7FC4E5"/>
      <stop offset="1" stop-color="#5FA9D2"/>
    </linearGradient>

    <linearGradient id="sunColumn" gradientUnits="userSpaceOnUse" x1="0" y1="514" x2="0" y2="640">
      <stop offset="0" stop-color="#FFF6CE" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#FFF6CE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFF6CE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="warmGlow" gradientUnits="userSpaceOnUse" cx="1120" cy="560" r="580">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.62" stop-color="#0B1B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1B2B" stop-opacity="0.16"/>
    </radialGradient>

    <g id="cloud">
      <circle cx="-54" cy="8" r="30"/>
      <circle cx="-14" cy="-10" r="42"/>
      <circle cx="34" cy="2" r="32"/>
      <circle cx="66" cy="14" r="22"/>
      <rect x="-62" y="2" width="134" height="32" rx="16"/>
    </g>

    <g id="pine">
      <rect x="-6" y="-20" width="12" height="24" fill="#6E4A2F"/>
      <path d="M0 -78 L52 -6 L-52 -6 Z" fill="#2F6E4D"/>
      <path d="M0 -112 L44 -50 L-44 -50 Z" fill="#357A52"/>
      <path d="M0 -146 L34 -92 L-34 -92 Z" fill="#3C8759"/>
    </g>

    <g id="tree">
      <rect x="-8" y="-34" width="16" height="38" rx="3" fill="#7A5233"/>
      <circle cx="-30" cy="-52" r="30" fill="#3F8F45"/>
      <circle cx="32" cy="-56" r="32" fill="#3F8F45"/>
      <circle cx="0" cy="-84" r="40" fill="#4CA24F"/>
      <circle cx="8" cy="-96" r="21" fill="#5CB35A"/>
    </g>

    <g id="bush">
      <circle cx="-28" cy="0" r="24" fill="#3E8A42"/>
      <circle cx="0" cy="-8" r="30" fill="#48994A"/>
      <circle cx="30" cy="2" r="22" fill="#3E8A42"/>
    </g>

    <g id="tuft" fill="none" stroke="#3B8743" stroke-width="4" stroke-linecap="round">
      <path d="M0 0 C-3 -10 -8 -16 -14 -20"/>
      <path d="M0 0 C-1 -14 0 -22 1 -30"/>
      <path d="M0 0 C4 -11 10 -16 16 -20"/>
    </g>

    <g id="flower">
      <path d="M0 0 C-1 -8 0 -14 0 -20" fill="none" stroke="#3E8A42" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-25" r="7" fill="#FFF4D8"/>
      <circle cx="0" cy="-25" r="3" fill="#FFC94A"/>
    </g>

    <g id="bird" fill="none" stroke="#3C5266" stroke-width="4" stroke-linecap="round">
      <path d="M-16 0 Q-8 -12 0 -3 Q8 -12 16 0"/>
    </g>

    <g id="smallPine">
      <rect x="-3" y="-6" width="6" height="10" fill="#5E4430"/>
      <path d="M0 -34 L12 -6 L-12 -6 Z" fill="#35745A"/>
      <path d="M0 -20 L16 6 L-16 6 Z" fill="#3A7D60"/>
    </g>
  </defs>

  <!-- ===== sky ===== -->
  <rect x="0" y="0" width="1440" height="805" fill="url(#skyGrad)"/>

  <!-- ===== sun ===== -->
  <circle cx="1060" cy="288" r="370" fill="url(#sunGlow)"/>
  <circle cx="1060" cy="288" r="176" fill="#FFF1BC" fill-opacity="0.18"/>
  <circle cx="1060" cy="288" r="132" fill="#FFE9A8" fill-opacity="0.32"/>
  <circle cx="1060" cy="288" r="96" fill="#FFE08A"/>
  <circle cx="1060" cy="288" r="76" fill="#FFEBA8"/>

  <!-- ===== clouds ===== -->
  <use href="#cloud" transform="translate(306,148) scale(1.18)" fill="#FFFFFF" fill-opacity="0.95"/>
  <use href="#cloud" transform="translate(830,110) scale(0.85)" fill="#FFFFFF" fill-opacity="0.9"/>
  <use href="#cloud" transform="translate(1236,198) scale(0.72)" fill="#FFFFFF" fill-opacity="0.85"/>
  <use href="#cloud" transform="translate(556,236) scale(0.5)" fill="#FFFFFF" fill-opacity="0.72"/>

  <!-- ===== birds ===== -->
  <use href="#bird" transform="translate(432,172) scale(1)"/>
  <use href="#bird" transform="translate(508,142) scale(0.82)"/>
  <use href="#bird" transform="translate(578,196) scale(0.68)"/>
  <use href="#bird" transform="translate(372,214) scale(0.6)"/>
  <use href="#bird" transform="translate(924,168) scale(0.7)"/>

  <!-- ===== far mountains ===== -->

        fill="#6E9AC4"/>

  <!-- ===== horizon haze ===== -->
  <rect x="0" y="462" width="1440" height="62" fill="url(#hazeGrad)"/>

  <!-- ===== far green hills ===== -->
  <path d="M0 524 L0 502 Q180 470 380 494 Q560 516 740 492 Q920 468 1100 494 Q1268 516 1440 494 L1440 524 Z"
        fill="#8CCB84"/>
  <use href="#smallPine" transform="translate(70,512) scale(0.9)"/>
  <use href="#smallPine" transform="translate(124,510) scale(1.05)"/>
  <use href="#smallPine" transform="translate(176,513) scale(0.8)"/>
  <use href="#smallPine" transform="translate(224,511) scale(0.95)"/>
  <use href="#smallPine" transform="translate(272,514) scale(0.75)"/>
  <use href="#smallPine" transform="translate(1002,508) scale(0.9)"/>
  <use href="#smallPine" transform="translate(1056,510) scale(1)"/>
  <use href="#smallPine" transform="translate(1110,512) scale(0.8)"/>
  <use href="#smallPine" transform="translate(1298,512) scale(0.95)"/>
  <use href="#smallPine" transform="translate(1352,510) scale(0.8)"/>
  <use href="#smallPine" transform="translate(1404,512) scale(0.9)"/>

  <!-- ===== lake ===== -->
  <rect x="0" y="518" width="1440" height="138" fill="url(#lakeGrad)"/>
  <path d="M0 518 L0 556 L140 536 L280 562 L420 540 L560 566 L700 542 L840 566 L980 544 L1120 564 L1260 542 L1440 560 L1440 518 Z"
        fill="#3F7FB4" fill-opacity="0.22"/>
  <path d="M1030 516 L1122 516 L1114 560 L1126 596 L1108 634 L1040 634 L1022 596 L1034 560 Z"
        fill="url(#sunColumn)"/>
  <g fill="#EAF7FD" fill-opacity="0.45">
    <rect x="120" y="536" width="180" height="5" rx="2.5"/>
    <rect x="480" y="552" width="140" height="5" rx="2.5"/>
    <rect x="756" y="540" width="200" height="5" rx="2.5"/>
    <rect x="1240" y="548" width="150" height="5" rx="2.5"/>
    <rect x="60" y="572" width="120" height="5" rx="2.5"/>
    <rect x="600" y="586" width="170" height="5" rx="2.5"/>
    <rect x="1180" y="578" width="200" height="5" rx="2.5"/>
  </g>
  <g fill="#FFF7D6">
    <rect x="1022" y="542" width="108" height="6" rx="3" fill-opacity="0.5"/>
    <rect x="1036" y="568" width="82" height="5" rx="2.5" fill-opacity="0.4"/>
    <rect x="1028" y="594" width="96" height="5" rx="2.5" fill-opacity="0.3"/>
  </g>

  <!-- ===== little boat ===== -->
  <g transform="translate(316,584)">
    <ellipse cx="0" cy="14" rx="32" ry="4" fill="#4E93BF" fill-opacity="0.35"/>
    <rect x="-2" y="-20" width="3" height="20" fill="#7A5233"/>
    <path d="M2 -20 L18 -4 L2 -4 Z" fill="#F4F1E8"/>
    <path d="M-34 0 L34 0 L24 12 L-24 12 Z" fill="#8A5A3B"/>
    <path d="M-34 0 L34 0 L31 4 L-31 4 Z" fill="#C97B4A"/>
  </g>

  <!-- ===== foreground meadow ===== -->
  <path d="M0 805 L0 622 Q130 594 268 612 Q404 630 556 606 Q712 582 872 610 Q1032 638 1196 612 Q1330 592 1440 616 L1440 805 Z"
        fill="#63B85B"/>
  <path d="M0 805 L0 708 Q196 682 414 700 Q636 718 856 698 Q1076 678 1258 700 Q1360 712 1440 700 L1440 805 Z"
        fill="#4E9E4A"/>
  <path d="M0 805 L0 770 Q160 748 342 762 Q524 776 722 760 Q902 746 1082 764 Q1262 782 1440 762 L1440 805 Z"
        fill="#3F8C42"/>
  <rect x="0" y="462" width="1440" height="343" fill="url(#warmGlow)"/>

  <!-- ===== trees ===== -->
  <use href="#pine" transform="translate(112,640) scale(1.08)"/>
  <use href="#pine" transform="translate(196,662) scale(0.82)"/>
  <use href="#pine" transform="translate(258,684) scale(0.6)"/>
  <use href="#pine" transform="translate(1332,650) scale(1)"/>
  <use href="#pine" transform="translate(1402,676) scale(0.72)"/>

  <use href="#tree" transform="translate(336,752) scale(1.25)"/>
  <use href="#tree" transform="translate(452,792) scale(0.95)"/>
  <use href="#tree" transform="translate(1216,716) scale(1.1)"/>

  <!-- ===== bushes ===== -->
  <use href="#bush" transform="translate(660,772) scale(1.3)"/>
  <use href="#bush" transform="translate(940,792) scale(1.45)"/>
  <use href="#bush" transform="translate(1180,748) scale(1)"/>
  <use href="#bush" transform="translate(772,706) scale(0.8)"/>
  <use href="#bush" transform="translate(100,790) scale(1.25)"/>

  <!-- ===== grass tufts ===== -->
  <use href="#tuft" transform="translate(60,700) scale(1.1)"/>
  <use href="#tuft" transform="translate(150,742) scale(1.3)"/>
  <use href="#tuft" transform="translate(238,786) scale(1.5)"/>
  <use href="#tuft" transform="translate(330,690) scale(0.9)"/>
  <use href="#tuft" transform="translate(418,730) scale(1.2)"/>
  <use href="#tuft" transform="translate(512,790) scale(1.4)"/>
  <use href="#tuft" transform="translate(600,700) scale(1)"/>
  <use href="#tuft" transform="translate(688,760) scale(1.25)"/>
  <use href="#tuft" transform="translate(782,700) scale(0.9)"/>
  <use href="#tuft" transform="translate(868,742) scale(1.15)"/>
  <use href="#tuft" transform="translate(962,788) scale(1.4)"/>
  <use href="#tuft" transform="translate(1052,706) scale(1)"/>
  <use href="#tuft" transform="translate(1140,750) scale(1.25)"/>
  <use href="#tuft" transform="translate(1232,700) scale(0.95)"/>
  <use href="#tuft" transform="translate(1320,756) scale(1.3)"/>
  <use href="#tuft" transform="translate(1408,712) scale(1.05)"/>

  <!-- ===== flowers ===== -->
  <use href="#flower" transform="translate(180,706) scale(1)"/>
  <use href="#flower" transform="translate(266,700) scale(1.15)"/>
  <use href="#flower" transform="translate(390,760) scale(1.2)"/>
  <use href="#flower" transform="translate(470,690) scale(0.95)"/>
  <use href="#flower" transform="translate(560,736) scale(1.1)"/>
  <use href="#flower" transform="translate(700,700) scale(1)"/>
  <use href="#flower" transform="translate(800,782) scale(1.3)"/>
  <use href="#flower" transform="translate(900,726) scale(1)"/>
  <use href="#flower" transform="translate(1010,700) scale(1.15)"/>

  <use href="#flower" transform="translate(1210,690) scale(0.95)"/>
  <use href="#flower" transform="translate(1300,740) scale(1.1)"/>
  <use href="#flower" transform="translate(1390,700) scale(1.05)"/>

  <!-- ===== vignette ===== -->
  <rect x="0" y="0" width="1440" height="805" fill="url(#vignette)"/>
</svg>
</div>
</body>
</html>
