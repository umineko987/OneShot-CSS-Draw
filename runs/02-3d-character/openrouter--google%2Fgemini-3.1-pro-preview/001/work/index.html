<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Character CSS Draw</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background-color: #6d8eb9;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="canvas">
  <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradients -->
      <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a122e" />
        <stop offset="40%" stop-color="#193b73" />
        <stop offset="70%" stop-color="#2c81ba" />
        <stop offset="90%" stop-color="#64d8f0" />
        <stop offset="100%" stop-color="#a8fcff" />
      </linearGradient>

      <radialGradient id="blush-grad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#ffa6a6" stop-opacity="0.7"/>
        <stop offset="40%" stop-color="#ffa6a6" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#ffa6a6" stop-opacity="0"/>
      </radialGradient>

      <!-- Filters -->
      <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15"/>
      </filter>
      <filter id="blur-lg" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10"/>
      </filter>
      <filter id="blur-md" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="blur-sm" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Reusable Star Shape for Halo -->
      <g id="star" stroke="#e6f5ff" stroke-width="2.5" filter="url(#glow)">
        <line x1="-16" y1="0" x2="16" y2="0" />
        <line x1="0" y1="-28" x2="0" y2="28" />
      </g>
    </defs>

    <!-- BACKGROUND -->
    <g filter="url(#blur-bg)">
      <rect width="100%" height="100%" fill="#7296b9"/>
      <!-- Blinds -->
      <g transform="rotate(-6 540 960)">
        <rect x="-200" y="0" width="1500" height="90" fill="#d2e7f7" opacity="0.8"/>
        <rect x="-200" y="180" width="1500" height="90" fill="#d2e7f7" opacity="0.8"/>
        <rect x="-200" y="360" width="1500" height="90" fill="#c0daef" opacity="0.8"/>
        <rect x="-200" y="540" width="1500" height="90" fill="#aecce6" opacity="0.8"/>
        <rect x="-200" y="720" width="1500" height="90" fill="#9dbfdd" opacity="0.8"/>
        <rect x="-200" y="900" width="1500" height="90" fill="#8cb2d3" opacity="0.8"/>
        <rect x="-200" y="1080" width="1500" height="90" fill="#7ba5c8" opacity="0.8"/>
        <rect x="-200" y="1260" width="1500" height="90" fill="#6a98be" opacity="0.8"/>
        <rect x="-200" y="1440" width="1500" height="90" fill="#588bb3" opacity="0.8"/>
        <rect x="-200" y="1620" width="1500" height="90" fill="#4b7fa6" opacity="0.8"/>
        
        <!-- Dark blocks mimicking depth/objects -->
        <path d="M-100 100 L 250 100 L 250 600 L -100 600 Z" fill="#1b2a3a" opacity="0.9"/>
        <path d="M-100 700 L 200 700 L 200 1200 L -100 1200 Z" fill="#203245" opacity="0.9"/>
      </g>
      <!-- Paw prints -->
      <g fill="#213447" transform="translate(60, 1050)">
        <circle cx="60" cy="60" r="22"/>
        <circle cx="20" cy="15" r="14"/>
        <circle cx="60" cy="-5" r="14"/>
        <circle cx="100" cy="15" r="14"/>
      </g>
      <g fill="#213447" transform="translate(130, 1350) scale(0.8) rotate(-20)">
        <circle cx="60" cy="60" r="22"/>
        <circle cx="20" cy="15" r="14"/>
        <circle cx="60" cy="-5" r="14"/>
        <circle cx="100" cy="15" r="14"/>
      </g>
    </g>

    <!-- BACK HAIR -->
    <path d="M 200 700 C 100 1200 150 1700 200 1920 L 900 1920 C 950 1600 950 1100 850 700 C 600 400 400 400 200 700 Z" fill="#161a20"/>
    <path d="M 150 1000 C 100 1400 150 1800 250 1920 L 200 1920 C 100 1700 50 1300 150 1000 Z" fill="#222830"/>

    <!-- CHEST & NECK BACKGROUND -->
    <path d="M 350 900 C 350 1050 450 1050 520 1050 C 600 1050 700 1050 700 900 Z" fill="#fff2f0"/>
    <path d="M 450 1000 C 500 1050 550 1050 600 1000 C 550 1020 500 1020 450 1000 Z" fill="#f5d5d3" filter="url(#blur-sm)"/>
    <path d="M 430 850 L 440 1050 C 500 1100 600 1050 590 850 Z" fill="#fff2f0"/>
    <path d="M 430 850 C 480 920 560 900 590 850 C 580 950 480 950 430 850 Z" fill="#f5d5d3"/>

    <!-- SHIRT BASE -->
    <path d="M 300 1050 C 400 1000 600 950 750 1050 C 850 1150 900 1300 900 1600 L 900 1920 L 250 1920 L 250 1400 C 250 1200 280 1100 300 1050 Z" fill="#e1ecf5"/>
    <path d="M 400 1000 C 480 1050 560 1050 650 1000 C 580 1100 450 1100 400 1000 Z" fill="#c3d6e8"/>
    <!-- Collarbones (faint) -->
    <path d="M 460 970 Q 520 1000 580 970" fill="none" stroke="#f5d5d3" stroke-width="3" filter="url(#blur-sm)"/>
    <path d="M 520 985 Q 520 1010 520 1030" fill="none" stroke="#f5d5d3" stroke-width="4" filter="url(#blur-sm)"/>

    <!-- CAT EARS -->
    <!-- Left Ear -->
    <path d="M 280 450 C 220 300 320 250 420 300 C 370 380 340 400 280 450 Z" fill="#1b1e22"/>
    <path d="M 310 400 C 280 330 330 290 380 320 C 350 360 330 370 310 400 Z" fill="#f4f7f9"/>
    <path d="M 320 390 L 300 340 L 330 360 L 320 310 L 350 340 L 360 300 L 370 330 Z" fill="#f4f7f9"/>
    <!-- Right Ear -->
    <path d="M 600 300 C 700 250 800 300 750 450 C 690 400 650 380 600 300 Z" fill="#1b1e22"/>
    <path d="M 640 320 C 690 290 740 330 710 400 C 690 370 670 360 640 320 Z" fill="#f4f7f9"/>
    <path d="M 650 330 L 680 300 L 670 340 L 710 320 L 690 360 L 720 360 L 700 390 Z" fill="#f4f7f9"/>

    <!-- FACE BASE -->
    <path d="M 320 650 C 330 780 420 920 520 940 C 540 945 560 940 570 930 C 660 880 700 760 690 630 C 680 500 580 470 500 480 C 400 490 310 520 320 650 Z" fill="#fff2f0"/>
    
    <!-- Face Shading (under hair) -->
    <path d="M 320 650 C 330 750 380 850 450 900 C 400 850 350 750 340 650 Z" fill="#f5d5d3" filter="url(#blur-sm)"/>
    <path d="M 690 630 C 680 750 640 850 570 900 C 620 850 670 750 680 630 Z" fill="#f5d5d3" filter="url(#blur-sm)"/>

    <!-- BLUSH -->
    <circle cx="390" cy="760" r="85" fill="url(#blush-grad)"/>
    <circle cx="610" cy="735" r="85" fill="url(#blush-grad)"/>

    <!-- NOSE & MOUTH -->
    <circle cx="495" cy="805" r="1.5" fill="#b07a80"/>
    <path d="M 485 845 Q 498 855 510 840" fill="none" stroke="#ba8287" stroke-width="2.5" stroke-linecap="round"/>

    <!-- EYES -->
    <!-- Left Eye -->
    <g>
      <!-- Sclera -->
      <path d="M 360 725 C 380 670 440 680 460 705 C 440 735 380 745 360 725 Z" fill="#ffffff"/>
      <!-- Iris & Details -->
      <clipPath id="l-eye-clip">
        <path d="M 360 725 C 380 670 440 680 460 705 C 440 735 380 745 360 725 Z"/>
      </clipPath>
      <g clip-path="url(#l-eye-clip)">
        <ellipse cx="410" cy="710" rx="38" ry="42" fill="url(#iris)"/>
        <ellipse cx="415" cy="705" rx="14" ry="18" fill="#060b1c"/>
        <ellipse cx="415" cy="705" rx="9" ry="12" fill="#1b3463"/>
        <path d="M 380 710 Q 415 670 440 710" fill="none" stroke="#318bc9" stroke-width="2" opacity="0.6"/>
        <path d="M 380 720 Q 415 740 440 720" fill="none" stroke="#a8fcff" stroke-width="5" filter="url(#glow)"/>
        <ellipse cx="415" cy="735" rx="28" ry="14" fill="#88f4ff" filter="url(#glow)"/>
        <!-- Highlights -->
        <ellipse cx="390" cy="685" rx="16" ry="9" fill="#ffffff" transform="rotate(-30 390 685)"/>
        <circle cx="435" cy="725" r="5" fill="#ffffff"/>
        <circle cx="385" cy="715" r="2.5" fill="#ffffff" opacity="0.8"/>
      </g>
      <!-- Lashes -->
      <path d="M 345 730 C 365 655 450 660 480 705 C 460 690 440 670 400 670 C 370 670 355 695 345 730 Z" fill="#1b1d22"/>
      <path d="M 345 730 Q 330 745 315 755" fill="none" stroke="#1b1d22" stroke-width="4" stroke-linecap="round"/>
      <path d="M 460 705 Q 470 715 475 725" fill="none" stroke="#1b1d22" stroke-width="3" stroke-linecap="round"/>
      <path d="M 370 740 Q 400 755 440 735" fill="none" stroke="#687b8f" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right Eye -->
    <g>
      <!-- Sclera -->
      <path d="M 550 690 C 580 645 640 655 655 685 C 635 715 580 715 550 690 Z" fill="#ffffff"/>
      <clipPath id="r-eye-clip">
        <path d="M 550 690 C 580 645 640 655 655 685 C 635 715 580 715 550 690 Z"/>
      </clipPath>
      <g clip-path="url(#r-eye-clip)">
        <ellipse cx="605" cy="685" rx="38" ry="42" fill="url(#iris)"/>
        <ellipse cx="600" cy="680" rx="14" ry="18" fill="#060b1c"/>
        <ellipse cx="600" cy="680" rx="9" ry="12" fill="#1b3463"/>
        <path d="M 570 685 Q 605 645 630 685" fill="none" stroke="#318bc9" stroke-width="2" opacity="0.6"/>
        <path d="M 570 695 Q 605 715 630 695" fill="none" stroke="#a8fcff" stroke-width="5" filter="url(#glow)"/>
        <ellipse cx="600" cy="710" rx="28" ry="14" fill="#88f4ff" filter="url(#glow)"/>
        <!-- Highlights -->
        <ellipse cx="580" cy="660" rx="16" ry="9" fill="#ffffff" transform="rotate(-25 580 660)"/>
        <circle cx="625" cy="700" r="5" fill="#ffffff"/>
        <circle cx="575" cy="690" r="2.5" fill="#ffffff" opacity="0.8"/>
      </g>
      <!-- Lashes -->
      <path d="M 535 695 C 565 625 645 635 675 685 C 655 670 630 650 595 650 C 565 650 550 670 535 695 Z" fill="#1b1d22"/>
      <path d="M 535 695 Q 520 705 510 710" fill="none" stroke="#1b1d22" stroke-width="3" stroke-linecap="round"/>
      <path d="M 675 685 Q 685 695 690 705" fill="none" stroke="#1b1d22" stroke-width="4" stroke-linecap="round"/>
      <path d="M 560 710 Q 590 725 630 710" fill="none" stroke="#687b8f" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- EYEBROWS (Faint under hair) -->
    <path d="M 370 650 Q 420 630 450 665" fill="none" stroke="#4a5666" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 550 640 Q 600 610 640 645" fill="none" stroke="#4a5666" stroke-width="2.5" stroke-linecap="round"/>

    <!-- FRONT HAIR (Bangs & Strands) -->
    <g fill="#1f242c">
      <!-- Base Bangs -->
      <path d="M 450 450 C 470 550 480 680 510 750 C 530 650 520 550 510 450 Z"/>
      <path d="M 400 450 C 420 550 430 650 460 720 C 480 620 460 550 450 450 Z"/>
      
      <!-- Left Bangs -->
      <path d="M 330 450 C 310 550 300 650 310 780 C 330 680 350 550 360 450 Z"/>
      <path d="M 360 450 C 350 550 340 650 360 760 C 380 660 390 550 400 450 Z"/>
      
      <!-- Right Bangs -->
      <path d="M 510 450 C 540 550 560 680 590 760 C 600 660 580 550 560 450 Z"/>
      <path d="M 560 450 C 600 550 620 660 650 740 C 650 640 620 550 600 450 Z"/>
      <path d="M 600 450 C 640 550 680 660 710 760 C 700 660 660 550 640 450 Z"/>
      
      <!-- Outer Side Locks -->
      <path d="M 280 450 C 240 600 200 900 250 1300 C 270 1000 300 700 310 450 Z"/>
      <path d="M 250 800 C 200 1100 150 1400 200 1800 C 230 1400 270 1100 300 800 Z"/>
      <path d="M 700 450 C 750 600 800 800 850 1100 C 800 850 750 650 720 450 Z"/>
      <path d="M 750 700 C 850 900 950 1200 1000 1600 C 920 1200 850 950 780 700 Z"/>
      
      <!-- Extra layering strands for volume -->
      <path d="M 280 600 C 250 800 230 1000 280 1200 C 260 1000 280 800 310 600 Z"/>
      <path d="M 780 600 C 820 800 850 1000 810 1200 C 830 1000 810 800 750 600 Z"/>
    </g>

    <!-- Translucent Hair Tips over eyes -->
    <g fill="#2f3640" opacity="0.8">
      <path d="M 450 480 C 470 580 470 680 490 740 C 500 650 490 550 480 480 Z"/>
      <path d="M 370 480 C 360 580 350 680 370 750 C 380 650 390 580 400 480 Z"/>
      <path d="M 610 480 C 640 580 650 680 670 730 C 660 640 630 580 620 480 Z"/>
    </g>
    
    <!-- Top Cowlicks (Ahoge) -->
    <path d="M 450 450 C 400 350 380 380 380 420 C 390 380 430 360 460 450 Z" fill="#1f242c"/>
    <path d="M 520 450 C 480 250 450 300 450 350 C 460 280 500 270 530 450 Z" fill="#1f242c"/>
    <path d="M 550 450 C 600 200 650 250 650 300 C 630 220 580 230 560 450 Z" fill="#1f242c"/>
    <path d="M 600 450 C 700 300 750 350 750 400 C 730 320 650 330 610 450 Z" fill="#1f242c"/>

    <!-- HAIR ACCESSORIES -->
    <!-- Left Hair Clips ("XI" shape) -->
    <g transform="translate(300, 600) rotate(-15)">
      <rect x="0" y="0" width="45" height="6" fill="#f0f4f8" rx="3"/>
      <rect x="0" y="18" width="45" height="6" fill="#f0f4f8" rx="3"/>
      <rect x="15" y="-5" width="6" height="35" fill="#f0f4f8" rx="3" transform="rotate(20 18 12)"/>
    </g>
    
    <!-- Right Silver Flower Clip -->
    <g transform="translate(680, 560)" fill="none" stroke="#d0d8e0" stroke-width="5" stroke-linecap="round">
      <path d="M 0 -10 C -20 -30 -30 0 -10 10 C -30 20 -20 50 0 30 C 20 50 30 20 10 10 C 30 0 20 -30 0 -10 Z"/>
      <circle cx="0" cy="10" r="4" fill="#d0d8e0"/>
    </g>

    <!-- FOREGROUND (Blurred Depth of Field) -->
    <g filter="url(#blur-md)">
      <!-- Right Knee (Center Bottom) -->
      <path d="M 350 1920 C 350 1600 450 1500 650 1500 C 850 1500 950 1650 950 1920 Z" fill="#fff2f0"/>
      <path d="M 450 1650 C 550 1550 650 1600 750 1700" fill="none" stroke="#f5d5d3" stroke-width="25" filter="url(#blur-lg)"/> <!-- knee shading -->

      <!-- Left Arm & Hand (Viewer's Left) -->
      <path d="M 100 1350 C 200 1450 350 1550 350 1700 L 250 1920 L -50 1920 L -50 1350 Z" fill="#e1ecf5"/>
      <path d="M 150 1350 C 200 1450 250 1550 350 1700" fill="none" stroke="#c3d6e8" stroke-width="15"/> <!-- Sleeve fold -->
      <!-- Black Cuff -->
      <path d="M 310 1520 C 350 1550 380 1620 350 1700 C 300 1620 280 1550 310 1520 Z" fill="#1a1d22"/>
      <path d="M 320 1530 C 350 1560 370 1620 340 1690" fill="none" stroke="#282d36" stroke-width="4"/>
      <!-- Hand resting on knee -->
      <g fill="#fff2f0">
        <path d="M 340 1650 C 320 1750 340 1850 370 1850 C 390 1850 410 1750 390 1650 Z"/>
        <!-- Thumb -->
        <path d="M 390 1680 C 420 1690 430 1720 420 1740 C 410 1750 400 1720 380 1700 Z"/>
        <!-- Finger outlines -->
        <path d="M 360 1700 C 350 1750 360 1800 370 1820" fill="none" stroke="#f5d5d3" stroke-width="3"/>
        <path d="M 370 1700 C 360 1750 370 1800 380 1820" fill="none" stroke="#f5d5d3" stroke-width="3"/>
      </g>

      <!-- Right Jacket (Viewer's Right, falling off) -->
      <path d="M 800 1400 C 850 1350 1000 1350 1080 1400 L 1080 1920 L 750 1920 Z" fill="#1a1d22"/>
      <!-- White Stripes on Jacket -->
      <path d="M 850 1400 C 900 1380 1000 1380 1080 1420 L 1080 1450 C 1000 1410 900 1410 850 1430 Z" fill="#e1ecf5"/>
      <path d="M 880 1460 C 920 1440 1000 1440 1080 1480 L 1080 1500 C 1000 1460 920 1460 880 1480 Z" fill="#e1ecf5"/>
    </g>

    <!-- HALO EFFECT -->
    <g opacity="0.85">
      <!-- Main halo ring -->
      <ellipse cx="540" cy="300" rx="380" ry="110" fill="none" stroke="#e6f5ff" stroke-width="1.5" filter="url(#glow)"/>
      
      <!-- Stars positioned around the halo -->
      <use href="#star" x="160" y="300" transform="rotate(10 160 300)" />
      <use href="#star" x="230" y="240" transform="rotate(-15 230 240)" />
      <use href="#star" x="350" y="210" transform="rotate(25 350 210)" />
      <use href="#star" x="480" y="195" transform="rotate(-5 480 195)" />
      <use href="#star" x="620" y="200" transform="rotate(15 620 200)" />
      <use href="#star" x="750" y="230" transform="rotate(-20 750 230)" />
      <use href="#star" x="870" y="270" transform="rotate(30 870 270)" />
      <use href="#star" x="920" y="330" transform="rotate(-10 920 330)" />
      
      <!-- Smaller scattered stars -->
      <use href="#star" x="300" y="150" transform="rotate(45 300 150) scale(0.6)" />
      <use href="#star" x="700" y="160" transform="rotate(45 700 160) scale(0.6)" />
      <use href="#star" x="850" y="180" transform="rotate(45 850 180) scale(0.5)" />
      <use href="#star" x="400" y="260" transform="rotate(15 400 260) scale(0.4)" />
    </g>
  </svg>
</div>
</body>
</html>
