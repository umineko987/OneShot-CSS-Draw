<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3D Character Render</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #c7d4e3;
  }
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }
  #stage svg { display: block; }
</style>
</head>
<body>
<div id="stage">
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- backgrounds -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4ecf5"/>
      <stop offset="0.42" stop-color="#cdd9e7"/>
      <stop offset="1" stop-color="#a3b6c9"/>
    </linearGradient>

    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba1bb" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8299b4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6e88a6" stop-opacity="0.44"/>
    </linearGradient>

    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.8">
      <stop offset="0.48" stop-color="#2b4257" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b4257" stop-opacity="0.38"/>
    </radialGradient>

    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#33475e" stop-opacity="0.52"/>
      <stop offset="0.6" stop-color="#3d5471" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3d5471" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- character materials -->
    <linearGradient id="shellU" gradientUnits="userSpaceOnUse" x1="250" y1="320" x2="900" y2="1660">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#f6f9fc"/>
      <stop offset="0.5" stop-color="#e3eaf2"/>
      <stop offset="0.76" stop-color="#c7d3e0"/>
      <stop offset="1" stop-color="#a6b6c8"/>
    </linearGradient>

    <linearGradient id="shellDarkU" gradientUnits="userSpaceOnUse" x1="250" y1="320" x2="900" y2="1660">
      <stop offset="0" stop-color="#dfe7f0"/>
      <stop offset="0.5" stop-color="#b8c5d5"/>
      <stop offset="1" stop-color="#8fa0b5"/>
    </linearGradient>

    <linearGradient id="visorG" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3d5069"/>
      <stop offset="0.55" stop-color="#1e2a3a"/>
      <stop offset="1" stop-color="#0d141d"/>
    </linearGradient>

    <radialGradient id="eyeG" cx="0.4" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#b9f5ff"/>
      <stop offset="0.68" stop-color="#4bd8f2"/>
      <stop offset="1" stop-color="#0f9fc8"/>
    </radialGradient>

    <radialGradient id="heartG" cx="0.4" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffd9e3"/>
      <stop offset="0.38" stop-color="#ff7d9d"/>
      <stop offset="1" stop-color="#e43460"/>
    </radialGradient>

    <radialGradient id="tealG" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#dcfbff"/>
      <stop offset="0.42" stop-color="#66e5f2"/>
      <stop offset="1" stop-color="#149ab9"/>
    </radialGradient>

    <linearGradient id="beltG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ae3ee"/>
      <stop offset="0.45" stop-color="#41bfd6"/>
      <stop offset="1" stop-color="#1d8fab"/>
    </linearGradient>

    <!-- blur filters -->
    <filter id="b6"  x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b10" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b18" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b30" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b48" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="48"/></filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="540" cy="880" r="780" fill="url(#spot)"/>

  <!-- out of focus light spots -->
  <circle cx="148" cy="352" r="72" fill="url(#bokeh)" filter="url(#b30)"/>
  <circle cx="946" cy="248" r="92" fill="url(#bokeh)" filter="url(#b30)"/>
  <circle cx="76"  cy="1292" r="64" fill="url(#bokeh)" filter="url(#b30)"/>
  <circle cx="1016" cy="1448" r="84" fill="url(#bokeh)" filter="url(#b30)"/>

  <!-- studio floor -->
  <rect x="0" y="1400" width="1080" height="520" fill="url(#floorG)"/>
  <ellipse cx="540" cy="1612" rx="470" ry="118" fill="#ffffff" opacity="0.30" filter="url(#b48)"/>

  <!-- soft cast shadow on the backdrop -->
  <ellipse cx="604" cy="1140" rx="336" ry="520" fill="#7a8fa8" opacity="0.22" filter="url(#b48)"/>

  <!-- contact shadow on the floor -->
  <ellipse cx="540" cy="1602" rx="326" ry="62" fill="url(#shadowG)" filter="url(#b18)"/>
  <ellipse cx="540" cy="1594" rx="218" ry="30" fill="#3a506b" opacity="0.34" filter="url(#b10)"/>

  <!-- CHARACTER -->
  <g id="bot">

    <!-- legs -->
    <g>
      <!-- left leg -->
      <line x1="460" y1="1296" x2="460" y2="1444" stroke="url(#shellU)" stroke-width="92" stroke-linecap="round"/>
      <circle cx="460" cy="1444" r="48" fill="url(#shellU)" stroke="#b0becf" stroke-width="5"/>
      <line x1="460" y1="1452" x2="460" y2="1544" stroke="url(#shellU)" stroke-width="86" stroke-linecap="round"/>
      <rect x="392" y="1504" width="136" height="92" rx="46" fill="url(#shellU)"/>
      <ellipse cx="460" cy="1534" rx="46" ry="14" fill="#ffffff" opacity="0.32" filter="url(#b6)"/>

      <!-- right leg -->
      <line x1="620" y1="1296" x2="620" y2="1444" stroke="url(#shellU)" stroke-width="92" stroke-linecap="round"/>
      <circle cx="620" cy="1444" r="48" fill="url(#shellU)" stroke="#b0becf" stroke-width="5"/>
      <line x1="620" y1="1452" x2="620" y2="1544" stroke="url(#shellU)" stroke-width="86" stroke-linecap="round"/>
      <rect x="552" y="1504" width="136" height="92" rx="46" fill="url(#shellU)"/>
      <ellipse cx="620" cy="1534" rx="46" ry="14" fill="#ffffff" opacity="0.32" filter="url(#b6)"/>
    </g>

    <!-- arms (behind torso) -->
    <g>
      <!-- left arm -->
      <circle cx="356" cy="944" r="74" fill="url(#shellU)"/>
      <line x1="330" y1="955" x2="300" y2="1118" stroke="url(#shellU)" stroke-width="80" stroke-linecap="round"/>
      <circle cx="300" cy="1124" r="46" fill="url(#shellU)" stroke="#b0becf" stroke-width="5"/>
      <line x1="300" y1="1136" x2="288" y2="1272" stroke="url(#shellU)" stroke-width="76" stroke-linecap="round"/>
      <circle cx="286" cy="1284" r="54" fill="url(#shellU)"/>
      <circle cx="316" cy="930" r="15" fill="url(#tealG)"/>

      <!-- right arm -->
      <circle cx="724" cy="944" r="74" fill="url(#shellU)"/>
      <line x1="750" y1="955" x2="780" y2="1118" stroke="url(#shellU)" stroke-width="80" stroke-linecap="round"/>
      <circle cx="780" cy="1124" r="46" fill="url(#shellU)" stroke="#b0becf" stroke-width="5"/>
      <line x1="780" y1="1136" x2="792" y2="1272" stroke="url(#shellU)" stroke-width="76" stroke-linecap="round"/>
      <circle cx="794" cy="1284" r="54" fill="url(#shellU)"/>
      <circle cx="764" cy="930" r="15" fill="url(#tealG)"/>
    </g>

    <!-- neck -->
    <rect x="498" y="792" width="84" height="100" rx="38" fill="url(#shellDarkU)"/>

    <!-- torso -->
    <g>
      <rect x="356" y="852" width="368" height="452" rx="132" fill="url(#shellU)"/>

      <!-- ambient occlusion / shading -->
      <ellipse cx="540" cy="886" rx="150" ry="46" fill="#8fa2b8" opacity="0.36" filter="url(#b18)"/>
      <ellipse cx="384" cy="1080" rx="42" ry="176" fill="#8ea0b5" opacity="0.30" filter="url(#b18)"/>
      <ellipse cx="696" cy="1080" rx="42" ry="176" fill="#8ea0b5" opacity="0.22" filter="url(#b18)"/>
      <ellipse cx="540" cy="1272" rx="152" ry="42" fill="#ffffff" opacity="0.16" filter="url(#b18)"/>

      <!-- key light glow -->
      <ellipse cx="452" cy="924" rx="106" ry="40" fill="#ffffff" opacity="0.42" filter="url(#b18)" transform="rotate(-12 452 924)"/>
      <!-- rim light -->
      <ellipse cx="712" cy="1058" rx="24" ry="152" fill="#ffffff" opacity="0.30" filter="url(#b10)"/>

      <!-- chest panel -->
      <rect x="428" y="948" width="224" height="232" rx="58" fill="url(#visorG)"/>
      <rect x="428" y="948" width="224" height="232" rx="58" fill="none" stroke="#8fa2b8" stroke-width="4" opacity="0.45"/>
      <ellipse cx="478" cy="986" rx="58" ry="22" fill="#ffffff" opacity="0.12" filter="url(#b10)"/>

      <!-- glowing heart -->
      <path d="M0 26 C-8 6 -26 -8 -46 -8 C-70 -8 -84 10 -84 30 C-84 58 -52 82 0 112 C52 82 84 58 84 30 C84 10 70 -8 46 -8 C26 -8 8 6 0 26 Z"
            transform="translate(540,982) scale(1.0)"
            fill="#ff5f8a" opacity="0.65" filter="url(#b30)"/>
      <path d="M0 26 C-8 6 -26 -8 -46 -8 C-70 -8 -84 10 -84 30 C-84 58 -52 82 0 112 C52 82 84 58 84 30 C84 10 70 -8 46 -8 C26 -8 8 6 0 26 Z"
            transform="translate(540,982) scale(0.82)"
            fill="url(#heartG)"/>
      <ellipse cx="-30" cy="14" rx="15" ry="9" fill="#ffffff" opacity="0.45" transform="translate(540,982) scale(0.82)"/>

      <!-- speaker grille -->
      <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="9" stroke-linecap="round">
        <line x1="486" y1="1118" x2="594" y2="1118"/>
        <line x1="486" y1="1146" x2="594" y2="1146"/>
      </g>

      <!-- waist belt -->
      <rect x="404" y="1238" width="272" height="62" rx="28" fill="url(#beltG)"/>
      <rect x="404" y="1238" width="272" height="62" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
    </g>

    <!-- antenna -->
    <line x1="540" y1="480" x2="540" y2="366" stroke="#c6d2df" stroke-width="14" stroke-linecap="round"/>
    <circle cx="540" cy="344" r="48" fill="#5fd9ee" opacity="0.55" filter="url(#b18)"/>
    <circle cx="540" cy="344" r="38" fill="url(#tealG)"/>
    <circle cx="528" cy="332" r="12" fill="#ffffff" opacity="0.85"/>

    <!-- head -->
    <g>
      <rect x="318" y="468" width="444" height="366" rx="152" fill="url(#shellU)"/>

      <!-- head shading -->
      <ellipse cx="540" cy="814" rx="146" ry="28" fill="#a3b3c6" opacity="0.34" filter="url(#b18)"/>
      <ellipse cx="540" cy="842" rx="92" ry="24" fill="#8296ac" opacity="0.40" filter="url(#b10)"/>
      <ellipse cx="736" cy="664" rx="26" ry="146" fill="#ffffff" opacity="0.30" filter="url(#b10)"/>

      <!-- visor -->
      <rect x="362" y="516" width="356" height="270" rx="96" fill="url(#visorG)"/>
      <rect x="362" y="516" width="356" height="270" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

      <!-- eye glow -->
      <rect x="405" y="589" width="100" height="112" rx="50" fill="#3fd9f5" opacity="0.70" filter="url(#b30)"/>
      <rect x="575" y="589" width="100" height="112" rx="50" fill="#3fd9f5" opacity="0.70" filter="url(#b30)"/>

      <!-- eyes -->
      <rect x="417" y="601" width="76" height="88" rx="38" fill="url(#eyeG)"/>
      <rect x="587" y="601" width="76" height="88" rx="38" fill="url(#eyeG)"/>
      <circle cx="444" cy="628" r="13" fill="#ffffff" opacity="0.92"/>
      <circle cx="614" cy="628" r="13" fill="#ffffff" opacity="0.92"/>
      <circle cx="470" cy="668" r="7" fill="#ffffff" opacity="0.50"/>
      <circle cx="640" cy="668" r="7" fill="#ffffff" opacity="0.50"/>

      <!-- smile -->
      <path d="M494 730 Q540 758 586 730" fill="none" stroke="#5fe3f7" stroke-width="14" stroke-linecap="round" opacity="0.55" filter="url(#b10)"/>
      <path d="M494 730 Q540 758 586 730" fill="none" stroke="#79ecfa" stroke-width="9" stroke-linecap="round" opacity="0.95"/>

      <!-- visor glass reflection -->
      <ellipse cx="436" cy="556" rx="104" ry="34" fill="#ffffff" opacity="0.10" filter="url(#b10)" transform="rotate(-12 436 556)"/>

      <!-- head gloss -->
      <ellipse cx="452" cy="546" rx="132" ry="42" fill="#ffffff" opacity="0.50" filter="url(#b18)" transform="rotate(-14 452 546)"/>

      <!-- ear pods -->
      <circle cx="306" cy="648" r="56" fill="url(#shellU)"/>
      <circle cx="774" cy="648" r="56" fill="url(#shellU)"/>
      <circle cx="306" cy="648" r="36" fill="#63dcf0" opacity="0.55" filter="url(#b18)"/>
      <circle cx="774" cy="648" r="36" fill="#63dcf0" opacity="0.55" filter="url(#b18)"/>
      <circle cx="306" cy="648" r="26" fill="url(#tealG)"/>
      <circle cx="774" cy="648" r="26" fill="url(#tealG)"/>

      <!-- antenna base -->
      <circle cx="540" cy="478" r="21" fill="url(#shellDarkU)"/>
      <circle cx="540" cy="478" r="10" fill="url(#tealG)" opacity="0.9"/>
    </g>
  </g>

  <!-- ATMOSPHERE -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#vig)"/>
  <rect x="0" y="0" width="1080" height="1920" filter="url(#grain)" opacity="0.045"/>
</svg>
</div>
</body>
</html>
